# Fabric-Folia — GitHub Actions CI
#
# Mirrors the Jenkins pipeline (Jenkinsfile): ./gradlew build --stacktrace,
# which compiles all modules, runs the full test suite, and packages the
# distributable fabric jar. No server boot here — the dev-server protocol
# (FREEBUFF.md §4) needs dedicated hardware and is NOT part of CI.
#
# Toolchain (must match the build):
#   - Java 25 — Minecraft 26.2 requires it (build.gradle.kts pins the toolchain)
#   - Gradle 9.5.1 — via the checked-in wrapper (gradle-wrapper.properties);
#     the wrapper action downloads it, so no Gradle step is needed
#   - Loom resolves Minecraft/Fabric artifacts from maven.fabricmc.net
#     (settings.gradle.kts pluginManagement) — nothing extra to configure
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
          retention-days: 7

      - name: Archive fabric mod jar
        uses: actions/upload-artifact@v4
        with:
          name: fabric-folia-mod
          path: fabric/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
