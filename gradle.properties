# =====================================================================================
# Fabric-Folia build properties
# -------------------------------------------------------------------------------------
# All version coordinates live here so a Minecraft update is a one-file change.
# Versions verified 2026-09-14 against:
#   - https://fabricmc.net/2026/06/15/262.html  (Fabric for Minecraft 26.2)
#   - https://github.com/FabricMC/fabric-example-mod (current default branch)
# Minecraft 26.2 is UNOBFUSCATED: Mojang class/method names are the runtime names.
# There is no mappings layer to configure in Loom for this project.
# =====================================================================================

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache + Loom.
org.gradle.configuration-cache=false

# --- Fabric toolchain (verified 2026-09-14) ---
# Loom 1.17.x is the line required for MC 26.2 development.
loom_version=1.17-SNAPSHOT
minecraft_version=26.2
loader_version=0.19.5
fabric_api_version=0.160.0+26.2

# --- SnakeYAML Engine (config format library, spec section 13) ---
# Apache-2.0, YAML 1.2, actively maintained (3.1.1 released Aug 2026).
# Comment round-tripping uses its low-level Composer/Node API
# (LoadSettingsBuilder.parseComments + DumpSettingsBuilder.setDumpComments),
# NOT the binding API (which silently drops comments). See common/build.gradle.kts.
snakeyaml_engine_version=3.1.1

# --- Mod coordinates ---
mod_version=0.1.0
maven_group=com.palordersoftworks.fabricfolia
archives_base_name=fabric-folia
